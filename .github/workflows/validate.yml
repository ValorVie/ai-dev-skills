name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate repository contracts
        run: python tests/validate_skills.py
      - name: Run direct Python tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_custom_agent_router_contract.py skills/work-log-claude/tests
      - name: Verify npx discovery
        env:
          DISABLE_TELEMETRY: "1"
        run: npx --yes skills@1.5.22 add . --list
